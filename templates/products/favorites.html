{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="page-header"><h1>{% trans "Mes favoris" %}</h1></div>
<div class="container" style="padding:50px 0;">
  <div class="product-grid">
    {% for fav in favorites %}
      {% with product=fav.product %}{% include "products/_product_card.html" %}{% endwith %}
    {% empty %}
      <p>{% trans "Vous n'avez pas encore de favoris." %}</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
